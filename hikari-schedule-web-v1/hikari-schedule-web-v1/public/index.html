<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2457a6">
  <title>光スケジュール</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div><span class="logo">光</span><div><h1>光スケジュール</h1><p>社長予定表</p></div></div>
    <button id="todayBtn" class="ghost">今日へ</button>
  </header>

  <main class="layout">
    <section class="card calendar-card">
      <div class="month-nav">
        <button id="prevMonth" aria-label="前月">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" aria-label="翌月">›</button>
      </div>
      <div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendar" class="calendar"></div>
      <p class="legend"><span class="dot"></span>予定あり</p>
    </section>

    <section class="card schedule-card">
      <div class="schedule-head">
        <div><p class="eyebrow">選択中の日付</p><h2 id="selectedDateTitle"></h2></div>
        <button id="addBtn" class="primary">＋ 予定追加</button>
      </div>
      <div id="loading" class="message">読み込み中です…</div>
      <div id="empty" class="message hidden">この日の予定はありません。</div>
      <div id="scheduleList" class="schedule-list"></div>
    </section>
  </main>

  <dialog id="eventDialog">
    <form id="eventForm" method="dialog">
      <div class="dialog-head"><h2 id="dialogTitle">予定追加</h2><button type="button" id="closeDialog" class="close">×</button></div>
      <input type="hidden" id="eventId">
      <label>日付<input id="eventDate" type="date" required></label>
      <label>時間<input id="eventTime" type="time" required></label>
      <label>何をするか<input id="eventTask" type="text" maxlength="200" placeholder="例：○○会社へ訪問" required></label>
      <div class="dialog-actions"><button type="button" id="cancelBtn" class="ghost">キャンセル</button><button type="submit" class="primary">保存する</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
