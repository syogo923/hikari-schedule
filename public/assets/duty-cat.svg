<style>
  .duty-broom-sweep {
    transform-box: fill-box;
    transform-origin: 13% 10%;
    animation: dutyBroomSweep 2.45s ease-in-out infinite;
  }
  .duty-broom-bristles {
    transform-box: fill-box;
    transform-origin: 34% 10%;
    animation: dutyBristleFlex 2.45s ease-in-out infinite;
  }
  @keyframes dutyBroomSweep {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes dutyBristleFlex {
    0%, 100% { transform: skewX(-2.5deg) scaleX(.985); }
    50% { transform: skewX(3.5deg) scaleX(1.015); }
  }
  @media (prefers-reduced-motion: reduce) {
    .duty-broom-sweep, .duty-broom-bristles { animation: none; }
  }
</style>
