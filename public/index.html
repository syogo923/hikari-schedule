<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1b3d"><title>光ポータル Ver2.2</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div class="brand"><img src="/icons/icon-192.png" alt=""><div><h1>光ポータル</h1><p>仕事の見える化・納期共有</p></div></div><button id="refresh" class="secondary">更新</button></header>
<nav><button class="nav active" data-view="home">ホーム</button><button class="nav" data-view="deadlines">納期一覧</button><button class="nav" data-view="masters">マスタ管理</button></nav>
<main><section id="homeView" class="view active"><div class="toolbar"><div><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><input id="search" type="search" placeholder="番船・表示名・製品・得意先・担当者を検索"><div class="toolbar-actions"><button id="importExcel" class="secondary">Excelデータ取込</button><button id="addProject" class="primary">＋ 案件を追加</button></div></div><div id="emptyEmployees" class="notice"></div><div class="schedule-wrap"><table id="scheduleTable"></table></div></section>
<section id="deadlinesView" class="view"><div class="section-head"><h2>納期一覧</h2><button class="primary" data-add>＋ 案件を追加</button></div><div id="deadlineList"></div></section>
<section id="mastersView" class="view"><h2>マスタ管理</h2><p class="muted">初期データはありません。会社で使う名称を登録してください。</p><div class="master-grid" id="masterGrid"></div></section></main>
<dialog id="projectDialog"><form id="projectForm"><header><h2 id="projectHeading">案件を追加</h2><button type="button" data-close>×</button></header><input id="projectId" type="hidden"><label>番船・案件番号<input id="shipNo" value="S." placeholder="S.2830" autocomplete="off"></label><label>表示名<input id="displayName" list="displayNameList" placeholder="入力または候補から選択" required autocomplete="off"><datalist id="displayNameList"></datalist></label><label>製品名<input id="productName" list="productNameList" placeholder="入力または候補から選択" required autocomplete="off"><datalist id="productNameList"></datalist></label><label>得意先<input id="client" list="clientList" placeholder="入力または候補から選択" autocomplete="off"><datalist id="clientList"></datalist></label><label>担当者<select id="employeeId" required></select></label><label>納期<input id="dueDate" type="date" required></label><label>メモ<textarea id="notes" rows="3"></textarea></label><p id="projectError" class="error"></p><footer><button type="button" class="secondary" data-close>キャンセル</button><button class="primary">登録する</button></footer></form></dialog>
<dialog id="importDialog" class="wide-dialog"><form id="importForm"><header><div><h2>Excelデータ取込</h2><p class="muted">Excelを読み込み、担当者と納期を指定して登録します。</p></div><button type="button" data-close>×</button></header><section id="importStep1"><label class="file-drop">Excelファイル<input id="excelFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required><span>クリックしてファイルを選択</span></label><p id="importReadError" class="error"></p><button type="button" id="readExcel" class="primary">Excelを読み取る</button></section><section id="importStep2" hidden><div class="import-common"><label>番船・案件番号<input id="importShipNo" value="S." autocomplete="off"></label><label>表示名<input id="importDisplayName" list="displayNameList" required autocomplete="off"></label><label>得意先<input id="importClient" list="clientList" autocomplete="off"></label><label>共通納期<input id="importDueDate" type="date" required></label><label>共通担当者<select id="importEmployee"></select></label></div><div class="import-tools"><button type="button" id="applyImportCommon" class="secondary">担当者・納期を全明細へ反映</button><span id="importCount" class="muted"></span></div><div class="import-table-wrap"><table class="import-table"><thead><tr><th>取込</th><th>製品名</th><th>数量</th><th>仕様・備考</th><th>担当者</th><th>納期</th></tr></thead><tbody id="importRows"></tbody></table></div><p id="importError" class="error"></p><footer><button type="button" class="secondary" id="backImport">ファイル選択へ戻る</button><button class="primary">選択した明細を登録</button></footer></section></form></dialog><dialog id="detailDialog"><div id="detailBody"></div></dialog><div id="toast"></div><script src="/app.js" defer></script></body></html>
