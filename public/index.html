<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6b57">
  <meta name="description" content="社内共有用のシンプルな社長スケジュール">
  <title>光スケジュール</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">光</div>
      <div>
        <h1>光スケジュール</h1>
        <p>社長予定表</p>
      </div>
    </div>
    <button id="refreshButton" class="secondary-button" type="button">更新</button>
  </header>

  <main class="page-shell">
    <section class="today-panel" aria-labelledby="todayTitle">
      <div>
        <p class="eyebrow">本日の予定</p>
        <h2 id="todayTitle">読み込み中…</h2>
      </div>
      <div id="todaySummary" class="today-summary" aria-live="polite"></div>
    </section>

    <section class="main-grid">
      <article class="card calendar-card">
        <div class="calendar-header">
          <button id="prevMonth" class="icon-button" type="button" aria-label="前の月">‹</button>
          <div>
            <h2 id="monthTitle"></h2>
            <button id="goToday" class="text-button" type="button">今日に戻る</button>
          </div>
          <button id="nextMonth" class="icon-button" type="button" aria-label="次の月">›</button>
        </div>
        <div class="weekday-row" aria-hidden="true">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div id="calendar" class="calendar-grid" role="grid" aria-label="月間カレンダー"></div>
      </article>

      <article class="card schedule-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">選択した日</p>
            <h2 id="selectedDateTitle"></h2>
          </div>
          <button id="openFormButton" class="primary-button" type="button">＋ 予定を追加</button>
        </div>
        <div id="scheduleList" class="schedule-list" aria-live="polite"></div>
      </article>
    </section>

    <section class="card upcoming-card">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">これからの予定</p>
          <h2>今後7日間</h2>
        </div>
      </div>
      <div id="upcomingList" class="upcoming-list"></div>
    </section>
  </main>

  <dialog id="scheduleDialog" class="schedule-dialog">
    <form id="scheduleForm" method="dialog" novalidate>
      <div class="dialog-header">
        <div>
          <p class="eyebrow">予定入力</p>
          <h2 id="dialogTitle">予定を追加</h2>
        </div>
        <button id="closeDialog" class="close-button" type="button" aria-label="閉じる">×</button>
      </div>

      <input id="eventId" type="hidden">
      <label>
        <span>日付</span>
        <input id="eventDate" type="date" required>
      </label>
      <label>
        <span>時間</span>
        <input id="eventTime" type="time" required>
      </label>
      <label>
        <span>何をするか</span>
        <input id="eventTask" type="text" maxlength="200" placeholder="例：○○会社へ訪問" required>
      </label>

      <p id="formError" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancelButton" class="secondary-button" type="button">キャンセル</button>
        <button id="saveButton" class="primary-button" type="submit">登録する</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
