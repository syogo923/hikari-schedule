<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1b3d"><title>光ポータル Ver2.0</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div class="brand"><img src="/icons/icon-192.png" alt=""><div><h1>光ポータル</h1><p>仕事の見える化・納期共有</p></div></div><button id="refresh" class="secondary">更新</button></header>
<nav><button class="nav active" data-view="home">ホーム</button><button class="nav" data-view="deadlines">納期一覧</button><button class="nav" data-view="masters">マスタ管理</button></nav>
<main><section id="homeView" class="view active"><div class="toolbar"><div><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><input id="search" type="search" placeholder="番船・表示名・製品・得意先・担当者を検索"><button id="addProject" class="primary">＋ 案件を追加</button></div><div id="emptyEmployees" class="notice"></div><div class="schedule-wrap"><table id="scheduleTable"></table></div></section>
<section id="deadlinesView" class="view"><div class="section-head"><h2>納期一覧</h2><button class="primary" data-add>＋ 案件を追加</button></div><div id="deadlineList"></div></section>
<section id="mastersView" class="view"><h2>マスタ管理</h2><p class="muted">初期データはありません。会社で使う名称を登録してください。</p><div class="master-grid" id="masterGrid"></div></section></main>
<dialog id="projectDialog"><form id="projectForm"><header><h2 id="projectHeading">案件を追加</h2><button type="button" data-close>×</button></header><input id="projectId" type="hidden"><label>番船・案件番号<input id="shipNo" placeholder="S.2830"></label><label>表示名<select id="displayName" required></select></label><label>製品名<select id="productName" required></select></label><label>得意先<select id="client"></select></label><label>担当者<select id="employeeId" required></select></label><label>納期<input id="dueDate" type="date" required></label><label>メモ<textarea id="notes" rows="3"></textarea></label><p id="projectError" class="error"></p><footer><button type="button" class="secondary" data-close>キャンセル</button><button class="primary">登録する</button></footer></form></dialog>
<dialog id="detailDialog"><div id="detailBody"></div></dialog><div id="toast"></div><script src="/app.js" defer></script></body></html>
